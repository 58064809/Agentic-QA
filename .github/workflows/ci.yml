name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEEPSEEK_API_KEY: ci-offline-placeholder
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: constraints.txt
      - uses: actions/setup-node@v4
        if: matrix.python-version == '3.12'
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,docs]" -c constraints.txt
          python -m pip check
      - name: Create local test configuration
        run: |
          python -m harness config init
          python scripts/configure-ci-local.py --profile ci
          python -m harness config doctor
      - name: Install pinned Allure 3
        if: matrix.python-version == '3.12'
        run: |
          npm ci
          npm audit --audit-level=high
          npm run allure:version
      - name: Ruff
        run: |
          ruff format --check .
          ruff check .
      - name: Tests
        run: pytest -q --basetemp="${{ runner.temp }}/pytest-${{ matrix.python-version }}"
      - name: Offline and golden eval
        run: python -m harness eval run
      - name: Documentation
        run: mkdocs build --strict
      - name: Build and inspect wheel
        run: |
          python -m build --wheel
          python -c "import glob,zipfile; names=zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert all(any(n.startswith(p) for n in names) for p in ('harness/domain/','harness/application/','harness/infrastructure/','harness/interfaces/','harness/manifests/','harness/manifests/prompts/','harness/knowledge/')); assert any(n.endswith('harness/knowledge/test-design.yml') for n in names); assert not any(n.startswith(('runtime/','rag/','scripts/')) for n in names); assert not any(n.startswith('harness/knowledge/') and n.endswith('.md') for n in names); assert not any('city_opening_rewards' in n for n in names)"
      - name: Upload Allure compatibility report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: allure-compatibility-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/pytest-3.12/**/allure-report

  cold-start:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEEPSEEK_API_KEY: ci-offline-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create fresh environment and install
        run: |
          python -m venv .fresh-venv
          .fresh-venv/bin/python -m pip install --upgrade pip
          .fresh-venv/bin/python -m pip install -e ".[dev,docs]" -c constraints.txt
          .fresh-venv/bin/python -m pip check
      - name: Initialize project configuration
        run: |
          .fresh-venv/bin/python -m harness config init
          .fresh-venv/bin/python scripts/configure-ci-local.py --profile ci
          .fresh-venv/bin/python -m harness config doctor
      - name: Verify fresh clone
        run: |
          .fresh-venv/bin/python -m pytest -q
          .fresh-venv/bin/python -m harness eval run
          .fresh-venv/bin/python -m mkdocs build --strict
          .fresh-venv/bin/python -m build --wheel

  playwright-mcp-live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEEPSEEK_API_KEY: ci-offline-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: constraints.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt
      - name: Create local test configuration
        run: |
          python -m harness config init
          python scripts/configure-ci-local.py --profile ci
          python -m harness config doctor
      - name: Install Playwright MCP browser
        run: npx --yes @playwright/mcp@latest install-browser chrome
      - name: Run official Playwright MCP live smoke
        env:
          AGENTIC_QA_PLAYWRIGHT_MCP_LIVE: "1"
          AGENTIC_QA_PLAYWRIGHT_MCP_OUTPUT_DIR: ${{ runner.temp }}/playwright-mcp-output
        run: pytest -q -m playwright_mcp_live tests/harness/test_playwright_mcp_live.py
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-mcp-live-smoke-${{ github.run_id }}
          if-no-files-found: ignore
          path: ${{ runner.temp }}/playwright-mcp-output
