name: Nightly live model eval

on:
  schedule:
    - cron: "30 18 * * *"
    - cron: "30 17 * * 0"
    - cron: "30 16 * * 0"
  workflow_dispatch:
    inputs:
      case:
        description: Live eval case
        required: true
        default: login-lock
        type: choice
        options:
          - login-lock
          - lottery-assistance
          - order-lifecycle

permissions:
  contents: read

jobs:
  live-eval:
    runs-on: ubuntu-latest
    environment: nightly-live-eval
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt
          python -m pip check
      - name: Create local live-eval configuration
        run: |
          python -m harness config init
          python scripts/configure-ci-local.py --profile nightly
          python -m harness config doctor
      - name: Run live candidate eval
        run: >-
          python -m harness eval live
          --case "${{ inputs.case || (github.event.schedule == '30 16 * * 0' && 'order-lifecycle') || (github.event.schedule == '30 17 * * 0' && 'lottery-assistance') || 'login-lock' }}"
          --output-dir "${{ runner.temp }}/agentic-qa-live-eval"
          | tee "${{ runner.temp }}/live-eval-result.json"
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-live-eval-${{ github.run_id }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/live-eval-result.json
            ${{ runner.temp }}/agentic-qa-live-eval/source-bundle.json
            ${{ runner.temp }}/agentic-qa-live-eval/requirement_analysis/raw.md
            ${{ runner.temp }}/agentic-qa-live-eval/requirement_analysis/quality-report.json
            ${{ runner.temp }}/agentic-qa-live-eval/requirement_analysis/generation-report.json
            ${{ runner.temp }}/agentic-qa-live-eval/testcases/raw.md
            ${{ runner.temp }}/agentic-qa-live-eval/testcases/quality-report.json
            ${{ runner.temp }}/agentic-qa-live-eval/testcases/generation-report.json
            ${{ runner.temp }}/agentic-qa-live-eval/api_test_draft/raw.yml
            ${{ runner.temp }}/agentic-qa-live-eval/api_test_draft/quality-report.json
            ${{ runner.temp }}/agentic-qa-live-eval/api_test_draft/generation-report.json

  failure-triage-live-eval:
    runs-on: ubuntu-latest
    environment: nightly-live-eval
    env:
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints.txt
          python -m pip check
      - name: Create local live-eval configuration
        run: |
          python -m harness config init
          python scripts/configure-ci-local.py --profile nightly
          python -m harness config doctor
      - name: Run Failure Triager live eval
        run: >-
          python -m harness eval failure-triage-live
          | tee "${{ runner.temp }}/failure-triage-live-eval-result.json"
      - name: Upload Failure Triager eval result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-triage-live-eval-${{ github.run_id }}
          if-no-files-found: error
          path: ${{ runner.temp }}/failure-triage-live-eval-result.json
