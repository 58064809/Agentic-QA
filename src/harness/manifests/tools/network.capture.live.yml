schema_version: agentic-qa.harness.tool-manifest.v2
name: network.capture.live
provider: builtin
description: 从本次受控 Playwright 会话提取并脱敏网络请求，返回强类型接口观察目录
input_schema:
  type: object
  properties:
    max_requests: {type: integer, minimum: 1, maximum: 25, default: 25}
  additionalProperties: false
output_schema:
  type: object
  required:
    - schema_version
    - source_path
    - capture_format
    - observed_call_count
    - business_candidate_count
    - calls
    - candidates
    - redactions
    - limitations
  properties:
    schema_version: {const: agentic-qa.api-discovery.v1.1}
    source_path: {type: string, pattern: "^runtime/playwright-network-capture/"}
    capture_format: {const: playwright_mcp}
    observed_call_count: {type: integer, minimum: 0, maximum: 500}
    business_candidate_count: {type: integer, minimum: 0, maximum: 500}
    calls: {type: array, maxItems: 500}
    candidates: {type: array, maxItems: 500}
    redactions: {type: array, items: {type: string}}
    limitations: {type: array, minItems: 1, items: {type: string}}
  additionalProperties: false
risk: test_mutation
timeout_seconds: 60
idempotency: keyed
