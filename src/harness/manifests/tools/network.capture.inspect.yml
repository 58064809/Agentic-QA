schema_version: agentic-qa.harness.tool-manifest.v2
name: network.capture.inspect
provider: builtin
description: 读取冻结 HAR 或简化 JSON，脱敏并归一化为运行时接口观察目录
input_schema:
  type: object
  required: [path]
  properties:
    path: {type: string, minLength: 1}
  additionalProperties: false
output_schema:
  type: object
  required:
    - schema_version
    - source_path
    - capture_format
    - observed_call_count
    - business_candidate_count
    - calls
    - candidates
    - redactions
    - limitations
  properties:
    schema_version: {const: agentic-qa.api-discovery.v1}
    source_path: {type: string, minLength: 1}
    capture_format: {enum: [har, simplified_json]}
    observed_call_count: {type: integer, minimum: 0, maximum: 500}
    business_candidate_count: {type: integer, minimum: 0, maximum: 500}
    calls: {type: array, maxItems: 500}
    candidates: {type: array, maxItems: 500}
    redactions: {type: array, items: {type: string}}
    limitations: {type: array, minItems: 1, items: {type: string}}
  additionalProperties: false
risk: read_only
timeout_seconds: 30
idempotency: read
