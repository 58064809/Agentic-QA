schema_version: agentic-qa.harness.tool-manifest.v2
name: openapi.inspect
provider: builtin
description: 校验完整 OpenAPI 并构建 endpoint 索引
input_schema:
  type: object
  required: [path]
  properties:
    path: {type: string, minLength: 1}
  additionalProperties: false
output_schema:
  type: object
  required:
    - schema_version
    - source
    - contract_status
    - specification
    - specification_version
    - endpoint_count
    - endpoints
  properties:
    schema_version: {const: agentic-qa.openapi-inspection.v1}
    source: {type: string, minLength: 1}
    contract_status: {const: confirmed}
    specification: {enum: [openapi, swagger]}
    specification_version: {type: string, minLength: 1}
    title: {type: string}
    server_urls: {type: array, items: {type: string}}
    security_schemes: {type: object}
    endpoint_count: {type: integer, minimum: 1, maximum: 500}
    endpoints:
      type: array
      minItems: 1
      maxItems: 500
      items:
        type: object
        required: [method, path, parameters, responses, security]
        properties:
          method: {enum: [GET, POST, PUT, PATCH, DELETE, HEAD, OPTIONS, TRACE]}
          path: {type: string, minLength: 1}
          operation_id: {type: string}
          summary: {type: string}
          description: {type: string}
          tags: {type: array, items: {type: string}}
          deprecated: {type: boolean}
          parameters: {type: array}
          request_body: {type: [object, "null"]}
          responses: {type: array}
          security: {type: array}
        additionalProperties: false
  additionalProperties: false
risk: read_only
timeout_seconds: 30
idempotency: read
