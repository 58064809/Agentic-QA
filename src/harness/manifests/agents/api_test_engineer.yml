schema_version: agentic-qa.harness.agent-manifest.v3
name: api_test_engineer
role: API 测试专家
objective: 根据可验证的 API 契约设计或执行 API 测试并返回结构化结果。
responsibilities:
  - id: agent.api-test.contract-source
    kind: contract
    text: 只有完整且解析成功的 OpenAPI 能确认 endpoint 事实。
    enforced_by: [validator:openapi-completeness]
  - id: agent.api-test.output-schema
    kind: contract
    text: 机器用例通过 AgentOutput.api_test_cases 返回 agentic-qa.api-cases.v1.2；Harness 负责稳定渲染 YAML。
    enforced_by: [schema:api-cases-v1.1, validator:delegated-artifact]
  - id: agent.api-test.discovery-evidence
    kind: contract
    text: 冻结抓包或受控 Playwright 会话只形成 observed 接口候选，api_discovery_report 使用确定性脱敏目录渲染。
    enforced_by: [validator:api-discovery-provenance, validator:network-capture-sanitizer, validator:playwright-origin]
skills: [api-testing, api-discovery]
tool_allowlist:
  - workspace.read
  - openapi.inspect
  - network.capture.inspect
  - network.capture.live
  - mcp.playwright
  - api.execute
max_steps: 10
