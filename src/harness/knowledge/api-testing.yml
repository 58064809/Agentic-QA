schema_version: agentic-qa.harness.knowledge-spec.v1
name: api-testing
version: 1.8.0
purpose: 根据完整 API 契约设计可验证的机器用例并记录执行边界。
applies_to: [api-testing]
inputs:
  - 完整且解析成功的 OpenAPI
  - 可选的标准 11 列人工 API 用例目录
  - ExecutionProfile
  - 脱敏测试数据或受控 fixture
procedure:
  - 通过 openapi.inspect 解析 SourceBundle 中的完整契约。
  - api_fast 快线只消费确定性识别后的 OpenAPI 与人工用例；其他文件不得发送给模型。
  - 每个人工用例 ID 至少映射一个 API Case，并使用 source_type=manual-test-case、chunk_id=人工用例 ID、confidence=high 的 source_refs。
  - 将重复数据转换为 variables.datasets，将跨步骤数据转换为 extract/${{variable}}，将清理步骤转换为 cleanup。
  - 人工步骤无法由完整 OpenAPI 确认时，生成 pending_confirmation 场景并保持 request.method/path 为 null，不补造 endpoint。
  - 提取 endpoint、method、参数、响应 Schema 和安全方案。
  - 覆盖认证授权、必填字段、类型、边界、错误码和状态副作用。
  - 对幂等、分页、并发、限流和超时建立独立场景。
  - 断言仅使用 status_code、json_field_exists、json_field_equals、json_field_contains、header_equals 或 response_time_ms_max。
  - 多组输入使用 variables.datasets；同一用例的 dataset ID 唯一且变量名集合一致。
  - OpenAPI 路径参数使用完整路径段 ${{name}} 表示，例如 /orders/{id} 生成为 /orders/${{order_id}}；不生成嵌入式路径模板。
  - 按 dataset 实例展开 path、query、headers 与 body，并以 OpenAPI 参数和 JSON Schema 逐实例校验。
  - 后续请求使用 ${{name}} 引用更早用例通过 response_json 或非敏感 response_header 提取的运行时变量。
  - 状态变更场景使用 cleanup 声明逆序回收请求，并为每个 cleanup 请求提供受支持断言。
  - 环境变量使用 ${ENV_NAME}；每个请求引用的环境变量都需要在发送前解析成功。
  - 数据集变量、跨用例提取变量和用例 ID 保持全场景唯一命名，不遮蔽更早定义。
output_expectations:
  - 机器用例写入 AgentOutput.api_test_cases，由 Harness 渲染为 YAML Candidate。
  - 请求使用结构化 method 和 path。
  - 人工用例映射质量报告记录总数、confirmed 数、unconfirmed 数和未映射 ID。
  - cleanup 继承主用例的 OpenAPI 来源，并使用与主请求相同的 operation 与 Schema 校验。
  - 上游提取变量的来源和响应字段必须存在；生成期未知的叶子值类型延迟到执行期，不伪造示例值。
  - 断言使用 agentic-qa.api-cases.v1.1 中的类型化 assertions。
  - JSON 断言路径只使用根 $、对象 .field 和数组 [index]，不使用通配符或过滤器。
  - variables 只使用 datasets 与 extract；cleanup 只使用 id、title、request 与 assertions。
evidence_policy:
  - Workspace Policy 的 trusted_origins 只接受 HTTPS Origin，实际 base URL 在认证前匹配该 allowlist。
  - base URL 只接受 HTTP(S) Origin 与安全基础路径；最终 URL 必须保持同一 Origin 和基础路径，且请求不跟随重定向。
  - 断言不得指向 Token、Cookie、密码等敏感字段，也不得把疑似密钥写入 expected。
  - 断言 expected 与实际 JSON/响应头值均只记录类型和规范化 SHA-256，不记录原值。
  - 部分变量提取失败时保留已成功的本次局部提取供 cleanup 使用，但不向下游用例发布。
  - 断言求值异常不跳过变量提取；成功提取值仅用于本次 cleanup，主用例仍记录 error。
  - endpoint 事实引用完整 OpenAPI。
  - 执行结果记录环境、请求摘要、响应摘要和断言结果。
  - JSON 值和响应头的实际值只记录类型与 SHA-256，不复述原始响应值。
  - 提取的运行时变量只保留在单次执行内，不写入 YAML、事件或证据。
  - 只有全部断言通过的用例向后续用例发布提取变量；cleanup 仍使用本次请求的局部快照。
uncertainty_policy:
  - Markdown、抓包或残缺契约形成 partial 或待确认项，request.method/path 保持 null。
prohibited_actions:
  - 不根据残缺来源补全 endpoint、响应字段或业务规则。
  - 不在输出中包含真实 Token、Cookie 或生产地址。
deterministic_checks:
  - validator:workspace-trusted-api-origin
  - validator:api-url-origin-and-path
  - validator:api-assertion-expected-safety
  - validator:openapi-completeness
  - validator:api-assertion-definition
  - validator:api-runtime-variable-definition
  - validator:api-cleanup-definition
  - validator:api-request-safety
  - validator:api-openapi-contract-semantics
  - schema:api-cases-v1.1
  - validator:execution-profile
